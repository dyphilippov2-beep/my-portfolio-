<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="theme-color" content="#000000">
<title>Портфель</title>
<style>
:root { --bg:#000; --card:#1c1c1e; --text:#fff; --green:#30d158; --red:#ff453a; --yellow:#ffd60a; --gray:#8e8e93; --border:#38383a; }
* { box-sizing:border-box; -webkit-tap-highlight-color:transparent; }
body { margin:0; background:var(--bg); color:var(--text); font-family:-apple-system,BlinkMacSystemFont,sans-serif; padding-bottom:100px; overflow-x: hidden; }

#lockScreen { position: fixed; inset: 0; background: #000; z-index: 9999; display: none; flex-direction: column; align-items: center; justify-content: center; }
.lock-icon { font-size: 64px; margin-bottom: 20px; }
.lock-title { font-size: 22px; font-weight: 600; margin-bottom: 40px; }
#pinPad { display: none; flex-direction: column; align-items: center; }
#pinDots { display: flex; gap: 20px; margin-bottom: 40px; }
.dot { width: 16px; height: 16px; border-radius: 50%; background: #333; transition: background 0.2s; }
.pin-grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 15px; }
.pin-btn { width: 75px; height: 75px; border-radius: 50%; background: #1c1c1e; color: #fff; font-size: 28px; font-weight: 500; border: none; cursor: pointer; display: flex; align-items: center; justify-content: center; }
.pin-btn:active { background: #333; }
.pin-btn.del { font-size: 20px; background: transparent; }

.header { padding:calc(20px + env(safe-area-inset-top)) 20px 10px; position: relative; }
.settings-btn { position: absolute; top: calc(20px + env(safe-area-inset-top)); right: 20px; font-size: 24px; cursor: pointer; background: none; border: none; color: #fff; opacity: 0.8; }
.label { font-size:13px; color:var(--gray); text-transform:uppercase; letter-spacing:.5px; }
.balance { font-size:40px; font-weight:700; margin:8px 0; letter-spacing:-1px; }
.profit-row { display:flex; align-items:center; gap:6px; font-size:16px; font-weight:600; flex-wrap:wrap; }
.green { color:var(--green); } .red { color:var(--red); }

.owners-filter { display:flex; gap:8px; padding:10px 20px 20px; overflow-x:auto; scrollbar-width:none; }
.owners-filter::-webkit-scrollbar { display:none; }
.owner-btn { background:var(--card); border:1px solid var(--border); color:var(--text); padding:8px 16px; border-radius:20px; font-size:14px; font-weight:600; white-space:nowrap; cursor:pointer; }
.owner-btn.active { background:var(--text); color:var(--bg); border-color:var(--text); }

.actions { display:flex; gap:10px; padding:0 20px 20px; overflow-x:auto; scrollbar-width:none; }
.actions::-webkit-scrollbar { display:none; }
.btn { background:var(--card); border:none; color:var(--text); padding:12px 16px; border-radius:14px; font-size:15px; font-weight:600; white-space:nowrap; display:flex; align-items:center; gap:8px; cursor:pointer; }
.btn-moex { color:var(--yellow); }

.group-wrap { margin-bottom:12px; border-radius:16px; background:var(--card); overflow:hidden; }
.group-header { padding:16px; display:flex; align-items:center; gap:14px; cursor:pointer; position:relative; }
.group-header:active { opacity:0.8; }
.icon-box { width:44px; height:44px; border-radius:50%; display:flex; align-items:center; justify-content:center; font-size:20px; font-weight:bold; flex-shrink:0; }
.info { flex:1; min-width:0; }
.name { font-size:17px; font-weight:600; margin-bottom:2px; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; display:flex; align-items:center; gap:6px; }
.details { font-size:13px; color:var(--gray); }
.values { text-align:right; flex-shrink:0; }
.val { font-size:17px; font-weight:700; margin-bottom:2px; }
.change { font-size:13px; font-weight:600; }

.group-body { display:none; background:#252527; border-top:1px solid var(--border); padding:10px 16px; }
.group-body.active { display:block; }
.acc-row { display:flex; justify-content:space-between; align-items:center; padding:12px 0; border-bottom:1px solid #333; font-size:14px; cursor:pointer; }
.acc-row:active { opacity:0.7; }
.acc-row:last-child { border-bottom:none; }
.acc-info { display:flex; flex-direction:column; }
.acc-name { font-weight:500; }
.acc-owner { font-size:12px; color:var(--gray); }
.acc-values { text-align:right; display:flex; align-items:center; gap:8px; }
.acc-qty { font-weight:600; }
.acc-sum { font-size:12px; color:var(--gray); }
.edit-icon { color:var(--yellow); font-size:16px; margin-left:4px; }

.bottom-bar { position:fixed; bottom:0; left:0; right:0; background:rgba(28,28,30,.95); backdrop-filter:blur(20px); padding:12px 20px calc(24px + env(safe-area-inset-bottom)); display:flex; gap:10px; border-top:.5px solid #38383a; z-index:50; }
.fab { flex:1; background:var(--yellow); color:#000; border:none; padding:16px; border-radius:14px; font-size:17px; font-weight:700; cursor:pointer; display: flex; align-items: center; justify-content: center; }
.fab:active { opacity:.8; }
.modal { display:none; position:fixed; inset:0; background:rgba(0,0,0,.85); z-index:100; align-items:flex-end; }
.modal.active { display:flex; }
.modal-content { background:var(--card); width:100%; max-height:85vh; border-radius:24px 24px 0 0; padding:24px 20px 40px; overflow-y:auto; animation:slideUp .3s cubic-bezier(.4,0,.2,1); position:relative; }
@keyframes slideUp { from { transform:translateY(100%); } to { transform:translateY(0); } }
input[type="text"], input[type="number"], select { width:100%; padding:14px; background:#2c2c2e; border:none; border-radius:12px; color:#fff; font-size:16px; margin-bottom:12px; box-sizing:border-box; outline:none; }
input:focus, select:focus { box-shadow:0 0 0 2px var(--yellow); }
label { display:block; font-size:13px; color:var(--gray); margin-bottom:6px; font-weight:500; }
.close-btn { position:absolute; top:16px; right:20px; width:32px; height:32px; border-radius:50%; background:#3a3a3c; border:none; color:#fff; font-size:16px; cursor:pointer; display: flex; align-items: center; justify-content: center; }
.empty-state { text-align:center; padding:60px 40px; color:var(--gray); font-size:15px; line-height:1.5; }

.ocr-overlay { display:none; position:fixed; inset:0; background:rgba(0,0,0,.9); z-index:200; flex-direction:column; align-items:center; justify-content:center; gap:20px; }
.ocr-overlay.active { display:flex; }
.spinner { width:44px; height:44px; border:4px solid #333; border-top-color:var(--yellow); border-radius:50%; animation:spin .8s linear infinite; }
@keyframes spin { to { transform:rotate(360deg); } }
.ocr-text { color:#fff; font-size:16px; text-align:center; padding:0 40px; line-height:1.5; font-weight:500; }

.settings-row { display: flex; justify-content: space-between; align-items: center; padding: 15px 0; border-bottom: 1px solid var(--border); }
.settings-row:last-child { border-bottom: none; }
.switch { position: relative; display: inline-block; width: 50px; height: 30px; }
.switch input { opacity: 0; width: 0; height: 0; }
.slider { position: absolute; cursor: pointer; top: 0; left: 0; right: 0; bottom: 0; background-color: #3a3a3c; transition: .4s; border-radius: 34px; }
.slider:before { position: absolute; content: ""; height: 26px; width: 26px; left: 2px; bottom: 2px; background-color: white; transition: .4s; border-radius: 50%; }
input:checked + .slider { background-color: var(--green); }
input:checked + .slider:before { transform: translateX(20px); }
</style>
</head>
<body>

<div id="lockScreen">
    <div class="lock-icon">🔒</div>
    <div class="lock-title">Портфель заблокирован</div>
    <div id="unlockMethods" style="display: flex; flex-direction: column; gap: 15px; width: 100%; align-items: center;">
        <button class="fab" onclick="tryFaceId()" style="width: 280px; display: none;" id="btnFaceIdUnlock">😊 Войти с Face ID</button>
        <button class="btn" onclick="showPin()" style="background: #1c1c1e; width: 280px; display: none; justify-content: center;" id="btnPinUnlock">🔢 Ввести PIN-код</button>
    </div>
    <div id="pinPad">
        <div id="pinDots"><div class="dot"></div><div class="dot"></div><div class="dot"></div><div class="dot"></div></div>
        <div class="pin-grid">
            <button class="pin-btn" onclick="pinInput('1')">1</button><button class="pin-btn" onclick="pinInput('2')">2</button><button class="pin-btn" onclick="pinInput('3')">3</button>
            <button class="pin-btn" onclick="pinInput('4')">4</button><button class="pin-btn" onclick="pinInput('5')">5</button><button class="pin-btn" onclick="pinInput('6')">6</button>
            <button class="pin-btn" onclick="pinInput('7')">7</button><button class="pin-btn" onclick="pinInput('8')">8</button><button class="pin-btn" onclick="pinInput('9')">9</button>
            <button class="pin-btn" style="visibility: hidden;"></button><button class="pin-btn" onclick="pinInput('0')">0</button><button class="pin-btn del" onclick="pinInput('del')">⌫</button>
        </div>
    </div>
</div>

<div id="mainApp" style="display: none;">
    <div class="header">
        <button class="settings-btn" onclick="document.getElementById('settingsModal').classList.add('active')">⚙️</button>
        <div class="label">Общий капитал</div>
        <div class="balance" id="totalBalance">0 ₽</div>
        <div class="profit-row">
            <span id="totalProfit">0 ₽</span><span style="color:var(--gray)">•</span><span id="totalPct">0%</span>
        </div>
    </div>
    <div class="owners-filter" id="ownersFilter"></div>
    <div class="actions">
        <button class="btn btn-moex" onclick="updateMarkets()">↻ Обновить</button>
        <button class="btn" onclick="triggerOCR()">📷 Скриншот</button>
        <button class="btn" onclick="exportData()">📤 Экспорт</button>
        <input type="file" id="ocrInput" accept="image/*" style="display:none" onchange="processOCR(this)">
        <input type="file" id="importFile" accept=".json" style="display:none" onchange="importData(this)">
    </div>
    <div id="appContent" style="padding: 0 20px;"></div>
    <div class="bottom-bar">
        <button class="fab" onclick="openModal()">＋ Добавить</button>
    </div>
</div>

<div class="modal" id="addModal">
    <div class="modal-content">
        <button class="close-btn" onclick="closeModal()">✕</button>
        <h2 id="modalTitle" style="margin:0 0 20px; font-size:22px;">Новый актив</h2>
        <label>Счёт / Брокер</label>
        <select id="assetAccount"></select>
        <label>Тип актива</label>
        <select id="assetType" onchange="toggleFields()">
            <option value="stock">Акция</option><option value="bond">Облигация</option>
            <option value="gold">Золото (монеты)</option><option value="cash">Наличные (Рубли)</option>
        </select>
        <label id="nameLabel">Тикер / Название</label>
        <input type="text" id="assetName" placeholder="SBER" autocomplete="off" autocapitalize="characters">
        <label id="qtyLabel">Количество</label>
        <input type="text" id="assetQty" placeholder="0" inputmode="decimal">
        <label id="priceLabel">Цена покупки (₽)</label>
        <input type="text" id="assetPrice" placeholder="0" inputmode="decimal">
        <label id="curLabel" style="display:none">Текущая цена (₽)</label>
        <input type="text" id="assetCur" placeholder="0" inputmode="decimal" style="display:none">
        <button class="fab" style="margin-top:16px; width:100%" onclick="saveAsset()">Сохранить</button>
    </div>
</div>

<div class="modal" id="settingsModal">
    <div class="modal-content">
        <button class="close-btn" onclick="document.getElementById('settingsModal').classList.remove('active')">✕</button>
        <h2 style="margin:0 0 20px; font-size:22px;">Настройки</h2>
        <div class="settings-row">
            <span>Защита при запуске</span>
            <label class="switch"><input type="checkbox" id="toggleProtection" onchange="toggleProtection()"><span class="slider"></span></label>
        </div>
        <button class="btn" onclick="registerFaceId()" style="width: 100%; justify-content: center; margin-top: 20px; background: #2c2c2e;">😊 Настроить Face ID</button>
        <button class="btn" onclick="setupPin()" style="width: 100%; justify-content: center; margin-top: 10px; background: #2c2c2e;">🔢 Установить PIN-код</button>
        <button class="btn" onclick="document.getElementById('importFile').click()" style="width: 100%; justify-content: center; margin-top: 20px; background: #2c2c2e;">📥 Импорт из файла</button>
    </div>
</div>

<div class="ocr-overlay" id="ocrOverlay">
    <div class="spinner"></div>
    <div class="ocr-text" id="ocrText">Инициализация...</div>
</div>

<script async src="https://cdn.jsdelivr.net/npm/tesseract.js@5/dist/tesseract.min.js"></script>
<script>
// ОБНОВЛЕННЫЙ СПИСОК СЧЕТОВ
const ACCOUNTS = {
    'acc1': { name: 'Сбер Инвестиции (малый)', owner: 'Дмитрий' },
    'acc2': { name: 'Сбер Инвестиции (большой)', owner: 'Дмитрий' },
    'acc3': { name: 'Т-Инвестиции', owner: 'Дмитрий' },
    'acc4': { name: 'Т-Инвестиции', owner: 'Аксана' },
    'acc5': { name: 'Сбер Инвестиции', owner: 'Аксана' },
    'acc6': { name: 'Дополнительный счёт', owner: 'Аксана' }
};

const TICKER_MAP = {
    'сбербанк': 'SBER', 'сбер': 'SBER', 'сбербанк россии': 'SBER',
    'газпром': 'GAZP', 'газпром нефть': 'SIBN', 'лукойл': 'LKOH', 
    'норникель': 'GMKN', 'норильский никель': 'GMKN', 'роснефть': 'ROSN', 
    'татнефть': 'TATN', 'т-технологии': 'T', 'тинькофф': 'T', 'яндекс': 'YDEX', 
    'московская биржа': 'MOEX', 'мосбиржа': 'MOEX', 'интер рао': 'IRAO', 
    'аэрофлот': 'AFLT', 'втб': 'VTBR', 'банк втб': 'VTBR', 'северсталь': 'CHMF', 
    'ммк': 'MAGN', 'новатэк': 'NVTK', 'полюс': 'PLZL', 'сургутнефтегаз': 'SNGS', 
    'транснефть': 'TRNFP', 'фосагро': 'PHOR', 'мтс': 'MTSS', 'магнит': 'MGNT',
    'альроса': 'ALRS', 'афк система': 'AFKS', 'россети': 'FEES', 'фск': 'FEES',
    'офз 26238': 'SU26238RMFS4', 'офз 26248': 'SU26248RMFS3'
};

const GOLD_WEIGHT = 7.78;
let holdings = [];
try { let saved = JSON.parse(localStorage.getItem('portfolio_v6')); if (Array.isArray(saved)) holdings = saved; } catch(e) {}

let appSettings = { protected: false, hasPin: false, hasFaceId: false };
try { let savedAuth = JSON.parse(localStorage.getItem('portfolio_auth')); if (savedAuth) appSettings = savedAuth; } catch(e) {}

let currentFilter = 'Все';
let expandedGroups = new Set();
let editingId = null;

const CONFIG = {
    stock: { icon:'📈', color:'#0a84ff' }, bond: { icon:'📄', color:'#ff9f0a' },
    gold: { icon:'🪙', color:'#ffd60a' }, cash: { icon:'💵', color:'#30d158' }
};

const uid = () => Date.now().toString(36) + Math.random().toString(36).slice(2,6);
const esc = s => String(s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const fmt = n => n.toLocaleString('ru-RU', { minimumFractionDigits:2, maximumFractionDigits:2 }) + ' ₽';
const num = v => { if (typeof v === 'number') return v; const s = String(v ?? '').trim().replace(/\s+/g, '').replace(',', '.'); const n = parseFloat(s); return Number.isFinite(n) ? n : 0; };

/* === БЕЗОПАСНОСТЬ === */
const bufferToBase64 = buf => btoa(String.fromCharCode(...new Uint8Array(buf)));
const base64ToBuffer = str => Uint8Array.from(atob(str), c => c.charCodeAt(0));
function saveSettings() { localStorage.setItem('portfolio_auth', JSON.stringify(appSettings)); }

function toggleProtection() {
    const isChecked = document.getElementById('toggleProtection').checked;
    if (isChecked) {
        if (!appSettings.hasPin && !appSettings.hasFaceId) {
            alert('Сначала установите PIN-код или настройте Face ID!');
            document.getElementById('toggleProtection').checked = false; return;
        }
        appSettings.protected = true;
    } else { appSettings.protected = false; }
    saveSettings();
}

function setupPin() {
    const pin = prompt('Введите новый 4-значный PIN-код:');
    if (pin && /^\d{4}$/.test(pin)) {
        localStorage.setItem('portfolio_pin', pin); appSettings.hasPin = true; saveSettings(); alert('PIN-код установлен.');
    } else if (pin !== null) { alert('PIN-код должен состоять ровно из 4 цифр.'); }
}

async function registerFaceId() {
    if (!window.PublicKeyCredential) return alert('Устройство не поддерживает Face ID.');
    try {
        const challenge = new Uint8Array(32); crypto.getRandomValues(challenge);
        const userId = new Uint8Array(16); crypto.getRandomValues(userId);
        const credential = await navigator.credentials.create({
            publicKey: {
                challenge, rp: { name: "Portfolio App", id: window.location.hostname },
                user: { id: userId, name: "user", displayName: "Investor" },
                pubKeyCredParams: [{ alg: -7, type: "public-key" }, { alg: -257, type: "public-key" }],
                authenticatorSelection: { authenticatorAttachment: "platform", userVerification: "required" }, timeout: 60000
            }
        });
        if (credential) {
            localStorage.setItem('faceIdCredId', bufferToBase64(credential.rawId)); appSettings.hasFaceId = true; saveSettings(); alert('Face ID настроен!');
        }
    } catch (e) { alert('Ошибка Face ID: ' + e.message); }
}

async function tryFaceId() {
    const credId = localStorage.getItem('faceIdCredId'); if (!credId) return;
    try {
        const challenge = new Uint8Array(32); crypto.getRandomValues(challenge);
        const assertion = await navigator.credentials.get({
            publicKey: { challenge, rpId: window.location.hostname, allowCredentials: [{ type: 'public-key', id: base64ToBuffer(credId) }], userVerification: "required", timeout: 60000 }
        });
        if (assertion) unlockApp();
    } catch (e) { if (appSettings.hasPin) showPin(); }
}

let pinInputBuffer = '';
function pinInput(val) {
    if (val === 'del') pinInputBuffer = pinInputBuffer.slice(0, -1);
    else if (val === 'reset') pinInputBuffer = '';
    else if (pinInputBuffer.length < 4) pinInputBuffer += val;
    
    document.querySelectorAll('#pinDots .dot').forEach((dot, i) => { dot.style.background = i < pinInputBuffer.length ? '#fff' : '#333'; });
    if (pinInputBuffer.length === 4) {
        if (pinInputBuffer === localStorage.getItem('portfolio_pin')) unlockApp();
        else { alert('Неверный PIN'); pinInput('reset'); }
    }
}

function showPin() { document.getElementById('unlockMethods').style.display = 'none'; document.getElementById('pinPad').style.display = 'flex'; }
function unlockApp() { document.getElementById('lockScreen').style.display = 'none'; document.getElementById('mainApp').style.display = 'block'; pinInput('reset'); document.getElementById('unlockMethods').style.display = 'flex'; document.getElementById('pinPad').style.display = 'none'; }

function checkLock() {
    try {
        if (appSettings.protected) {
            document.getElementById('lockScreen').style.display = 'flex'; document.getElementById('mainApp').style.display = 'none';
            if (appSettings.hasFaceId) { document.getElementById('btnFaceIdUnlock').style.display = 'flex'; setTimeout(() => tryFaceId(), 500); }
            if (appSettings.hasPin) { document.getElementById('btnPinUnlock').style.display = 'flex'; }
            document.getElementById('toggleProtection').checked = true;
        } else {
            document.getElementById('lockScreen').style.display = 'none'; document.getElementById('mainApp').style.display = 'block'; document.getElementById('toggleProtection').checked = false;
        }
    } catch(e) { document.getElementById('mainApp').style.display = 'block'; }
}

/* === ОСНОВНАЯ ЛОГИКА === */
function save() { localStorage.setItem('portfolio_v6', JSON.stringify(holdings)); render(); }
function renderFilters() {
    document.getElementById('ownersFilter').innerHTML = ['Все', 'Дмитрий', 'Аксана'].map(o => `<button class="owner-btn ${currentFilter === o ? 'active' : ''}" onclick="setFilter('${o}')">${o}</button>`).join('');
}
function setFilter(owner) { currentFilter = owner; render(); }

function render() {
    try {
        renderFilters();
        const filtered = holdings.filter(h => currentFilter === 'Все' || ACCOUNTS[h.accId]?.owner === currentFilter);
        const grouped = {};
        filtered.forEach(h => {
            if (!grouped[h.name]) grouped[h.name] = { name: h.name, type: h.type, totalQty: 0, totalCost: 0, totalVal: 0, accounts: [] };
            const g = grouped[h.name];
            g.totalQty += h.qty; g.totalCost += h.qty * (h.avg || 0); g.totalVal += h.qty * (h.cur || 0); g.accounts.push(h);
        });

        const groups = Object.values(grouped).sort((a, b) => b.totalVal - a.totalVal);
        let tv = 0, ti = 0; groups.forEach(g => { tv += g.totalVal; ti += g.totalCost; });
        const pr = tv - ti; const pc = ti > 0 ? (pr / ti) * 100 : 0;

        document.getElementById('totalBalance').textContent = fmt(tv);
        const pEl = document.getElementById('totalProfit'); pEl.textContent = (pr >= 0 ? '+' : '') + fmt(pr); pEl.className = pr >= 0 ? 'green' : 'red';
        const pctEl = document.getElementById('totalPct'); pctEl.textContent = `(${(pc >= 0 ? '+' : '') + pc.toFixed(2)}%)`; pctEl.className = pc >= 0 ? 'green' : 'red';

        if (!groups.length) { document.getElementById('appContent').innerHTML = '<div class="empty-state">Нет активов<br><br>Нажмите «＋ Добавить»</div>'; return; }

        document.getElementById('appContent').innerHTML = groups.map(g => {
            const cfg = CONFIG[g.type] || CONFIG.stock;
            const profit = g.totalVal - g.totalCost; const pct = g.totalCost > 0 ? (profit / g.totalCost) * 100 : 0;
            const isExpanded = expandedGroups.has(g.name) ? 'active' : '';

            const accRows = g.accounts.map(h => {
                const acc = ACCOUNTS[h.accId] || { name: 'Счет', owner: '-' };
                return `
                <div class="acc-row" onclick="editHolding('${h.id}')">
                    <div class="acc-info"><span class="acc-name">${acc.name}</span><span class="acc-owner">${acc.owner}</span></div>
                    <div class="acc-values">
                        <div><div class="acc-qty">${h.qty} ${g.type === 'cash' ? '₽' : 'шт.'}</div><div class="acc-sum">${fmt(h.qty * (h.cur || 0))}</div></div>
                        <div class="edit-icon">✎</div>
                    </div>
                </div>`;
            }).join('');

            let details = `${g.totalQty} ${g.type === 'cash' ? '₽' : 'шт.'}`;
            if (g.type === 'gold') details += ` • ${(g.totalQty * GOLD_WEIGHT).toFixed(2)} г`;

            return `
            <div class="group-wrap">
                <div class="group-header" onclick="toggleGroup('${esc(g.name)}')">
                    <div class="icon-box" style="background:${cfg.color}22;color:${cfg.color}">${cfg.icon}</div>
                    <div class="info"><div class="name">${esc(g.name)}</div><div class="details">${details}</div></div>
                    <div class="values"><div class="val">${fmt(g.totalVal)}</div><div class="change ${profit >= 0 ? 'green' : 'red'}">${profit >= 0 ? '+' : ''}${fmt(profit)} (${pct.toFixed(1)}%)</div></div>
                </div>
                <div class="group-body ${isExpanded}">${accRows}</div>
            </div>`;
        }).join('');
    } catch (e) { document.getElementById('appContent').innerHTML = '<div class="empty-state">Ошибка загрузки данных.</div>'; }
}

function toggleGroup(name) { if (expandedGroups.has(name)) expandedGroups.delete(name); else expandedGroups.add(name); render(); }
function editHolding(id) {
    const h = holdings.find(x => x.id === id); if (!h) return;
    editingId = id; document.getElementById('modalTitle').textContent = 'Редактировать';
    document.getElementById('assetAccount').value = h.accId; document.getElementById('assetType').value = h.type;
    document.getElementById('assetName').value = h.name; document.getElementById('assetQty').value = h.qty;
    document.getElementById('assetPrice').value = h.avg; toggleFields();
    if (h.type !== 'cash') { document.getElementById('assetCur').value = h.cur; document.getElementById('curLabel').style.display = 'block'; document.getElementById('assetCur').style.display = 'block'; }
    document.getElementById('addModal').classList.add('active');
}

function initSelects() { 
    document.getElementById('assetAccount').innerHTML = Object.entries(ACCOUNTS).map(([id, acc]) => 
        `<option value="${id}">${acc.name} - ${acc.owner}</option>`
    ).join(''); 
}

function toggleFields() {
    const t = document.getElementById('assetType').value;
    const nl = document.getElementById('nameLabel'), ql = document.getElementById('qtyLabel'), pl = document.getElementById('priceLabel');
    const ni = document.getElementById('assetName'), prIn = document.getElementById('assetPrice');
    const curIn = document.getElementById('assetCur'), curLb = document.getElementById('curLabel');

    if (t === 'gold') { nl.textContent = 'Название'; ni.placeholder = 'Георгий Победоносец'; ql.textContent = 'Кол-во (шт)'; pl.textContent = 'Цена покупки (₽)'; curLb.textContent = 'Текущая цена (₽)'; }
    else if (t === 'cash') { nl.textContent = 'Валюта'; ni.placeholder = 'Рубли'; ql.textContent = 'Сумма (₽)'; pl.textContent = 'Номинал'; }
    else { nl.textContent = 'Тикер'; ni.placeholder = 'SBER'; ql.textContent = 'Количество (шт)'; pl.textContent = 'Цена покупки (₽)'; }

    if (t === 'cash') { prIn.value = '1'; prIn.disabled = true; curLb.style.display = 'none'; curIn.style.display = 'none'; } 
    else { prIn.disabled = false; curLb.style.display = 'block'; curIn.style.display = 'block'; }
}

function openModal() { editingId = null; document.getElementById('modalTitle').textContent = 'Новый актив'; ['assetName','assetQty','assetPrice','assetCur'].forEach(id => document.getElementById(id).value = ''); toggleFields(); document.getElementById('addModal').classList.add('active'); }
function closeModal() { document.getElementById('addModal').classList.remove('active'); editingId = null; }

function saveAsset() {
    const accId = document.getElementById('assetAccount').value;
    const type = document.getElementById('assetType').value;
    let name = document.getElementById('assetName').value.trim();
    let qty = num(document.getElementById('assetQty').value);
    let price = num(document.getElementById('assetPrice').value);
    let cur = num(document.getElementById('assetCur').value);

    if (!name || qty <= 0) return alert('Заполните название и количество');
    const upperName = name.toUpperCase();
    if (TICKER_MAP[name.toLowerCase()]) name = TICKER_MAP[name.toLowerCase()];
    else if (type === 'stock' || type === 'bond') name = upperName; 

    if (type === 'cash') { price = 1; cur = 1; }
    else if (type === 'gold' && cur <= 0) cur = price;
    else if (!cur) cur = price;

    if (editingId) {
        const h = holdings.find(x => x.id === editingId);
        if (h) { h.accId = accId; h.type = type; h.name = name; h.qty = qty; h.avg = price; h.cur = cur; }
    } else {
        holdings.push({ id: uid(), accId, type, name, qty, avg: price, cur: cur, face: type === 'bond' ? 1000 : undefined });
    }
    save(); closeModal();
    if (type !== 'cash') updateMarkets();
}

/* === УЛУЧШЕННЫЙ OCR === */
function triggerOCR() {
    if (typeof Tesseract === 'undefined') return alert('Библиотека распознавания еще загружается. Подождите пару секунд.');
    const accList = Object.keys(ACCOUNTS).map(k => `${k}: ${ACCOUNTS[k].name} (${ACCOUNTS[k].owner})`).join('\n');
    const accId = prompt(`На какой счет загружаем скриншот?\nВведите код:\n\n${accList}`, "acc1");
    if (accId && ACCOUNTS[accId]) { window._ocrTargetAccount = accId; document.getElementById('ocrInput').click(); }
    else if (accId) alert('Неверный код счета');
}

function preprocessImage(file) {
    return new Promise((resolve) => {
        const img = new Image();
        img.onload = () => {
            const canvas = document.createElement('canvas');
            const ctx = canvas.getContext('2d');
            const scale = 2.5;
            canvas.width = img.width * scale;
            canvas.height = img.height * scale;
            ctx.drawImage(img, 0, 0, canvas.width, canvas.height);

            const imageData = ctx.getImageData(0, 0, canvas.width, canvas.height);
            const data = imageData.data;
            
            let totalBrightness = 0;
            for (let i = 0; i < data.length; i += 4) {
                totalBrightness += (data[i] + data[i+1] + data[i+2]) / 3;
            }
            const avgBrightness = totalBrightness / (data.length / 4);
            const isDarkMode = avgBrightness < 128; 

            for (let i = 0; i < data.length; i += 4) {
                const gray = 0.299 * data[i] + 0.587 * data[i+1] + 0.114 * data[i+2];
                let val = gray > 128 ? 255 : 0;
                if (isDarkMode) val = 255 - val;
                data[i] = data[i+1] = data[i+2] = val;
            }
            ctx.putImageData(imageData, 0, 0);
            resolve(canvas.toDataURL('image/png'));
        };
        img.src = URL.createObjectURL(file);
    });
}

async function processOCR(input) {
    const file = input.files[0];
    if (!file) return;
    const overlay = document.getElementById('ocrOverlay');
    const textEl = document.getElementById('ocrText');
    overlay.classList.add('active'); 
    textEl.textContent = 'Улучшение изображения...';

    let worker = null;
    try {
        const processedImage = await preprocessImage(file);
        textEl.textContent = 'Загрузка движка (1/2)...';
        worker = await Tesseract.createWorker('rus+eng', 1, {
            logger: m => { 
                if (m.status === 'recognizing text') textEl.textContent = `Распознавание: ${Math.round(m.progress * 100)}%`;
            }
        });
        const result = await worker.recognize(processedImage);
        textEl.textContent = 'Анализ данных...';
        parseOCRResult(result.data.text, window._ocrTargetAccount);
    } catch(e) { 
        alert('Ошибка распознавания: ' + e.message); 
    } finally { 
        if (worker) await worker.terminate();
        overlay.classList.remove('active'); 
        input.value = ''; 
    }
}

function parseOCRResult(text, targetAccId) {
    const lines = text.split('\n').map(l => l.trim()).filter(l => l.length > 0);
    let found = 0;
    let resultLog = [];

    for (let i = 0; i < lines.length; i++) {
        let matchedTicker = null;
        let tickerName = "";
        const lineLower = lines[i].toLowerCase();

        for (const [key, ticker] of Object.entries(TICKER_MAP)) {
            if (lineLower.includes(key)) { matchedTicker = ticker; tickerName = key; break; }
        }

        if (lineLower.includes('офз')) {
            const m = lines[i].match(/офз\s*(\d{5})/i) || lines[i].match(/офз\s*(\d{4})/i);
            if (m) { matchedTicker = `SU${m[1]}RMFS4`; tickerName = `ОФЗ ${m[1]}`; }
        }

        if (matchedTicker) {
            const searchSpace = lines[i] + ' ' + (lines[i+1] || '') + ' ' + (lines[i+2] || '');
            const qtyMatch = searchSpace.match(/(\d[\d\s]*)\s*(шт|штук)/i);
            
            if (qtyMatch) {
                const qty = parseInt(qtyMatch[1].replace(/\s/g, ''), 10);
                if (qty > 0) {
                    const existing = holdings.find(h => h.accId === targetAccId && h.name === matchedTicker);
                    if (existing) existing.qty = qty;
                    else holdings.push({ id: uid(), accId: targetAccId, type: matchedTicker.startsWith('SU') ? 'bond' : 'stock', name: matchedTicker, qty: qty, avg: 0, cur: 0 });
                    found++;
                    resultLog.push(`${matchedTicker} (${tickerName}) - ${qty} шт.`);
                    i += 2;
                }
            }
        }
    }

    if (found > 0) { 
        save(); 
        setTimeout(() => alert(`Успешно распознано активов: ${found}\n\n${resultLog.join('\n')}\n\nНе забудьте вписать цену покупки.`), 300); 
        updateMarkets(); 
    } else {
        alert('Не удалось найти акции с количеством ("шт").\nУбедитесь, что на скриншоте есть названия бумаг и количество.');
    }
}

/* === СЕТЬ === */
async function safeFetch(url, timeoutMs = 4000) {
    try { const ctrl = new AbortController(); const id = setTimeout(() => ctrl.abort(), timeoutMs); const res = await fetch(url, { signal: ctrl.signal }); clearTimeout(id); return res.ok ? await res.json() : null; } catch { return null; }
}

async function updateMarkets() {
    const btn = document.querySelector('.btn-moex'); if (btn.disabled) return;
    const orig = btn.textContent; btn.disabled = true; btn.textContent = '⏳';

    const tasks = [];
    if (holdings.some(h => h.type === 'gold')) {
        tasks.push((async () => {
            const cbr = await safeFetch('https://www.cbr-xml-daily.ru/daily_json.js');
            if (cbr?.Valute?.XAU?.Value) {
                const g = cbr.Valute.XAU.Value / 31.1035;
                holdings.forEach(h => { if (h.type === 'gold') h.cur = Math.round(g * GOLD_WEIGHT); });
            }
        })());
    }

    const moex = holdings.filter(h => h.type === 'stock' || h.type === 'bond');
    const tickers = [...new Set(moex.map(h => h.name.toUpperCase()))];

    tickers.forEach(t => {
        tasks.push((async () => {
            const desc = await safeFetch(`https://iss.moex.com/iss/securities/${encodeURIComponent(t)}.json`); if (!desc) return;
            let face = null; const fRow = (desc.description?.data || []).find(r => r[0] === 'FACEVALUE'); if (fRow && fRow[2] != null) face = parseFloat(fRow[2]);
            let market = 'shares', board = 'TQBR';
            const bc = desc.boards?.columns || [], bd = desc.boards?.data || [], bi = bc.indexOf('boardid'), mi = bc.indexOf('market');
            if (bi > -1) {
                const pref = moex.find(h => h.name.toUpperCase() === t)?.type === 'bond' ? ['TQCB', 'TQOB', 'TQIR'] : ['TQBR', 'TQTF', 'TQIF', 'TQBS'];
                const row = bd.find(r => pref.includes(r[bi])) || bd[0];
                if (row) { board = row[bi]; market = row[mi]; }
            }
            const md = await safeFetch(`https://iss.moex.com/iss/engines/stock/markets/${market}/boards/${board}/securities/${encodeURIComponent(t)}.json`);
            const cols = md?.marketdata?.columns || [], rows = md?.marketdata?.data || [];
            let lastPrice = null;
            if (rows.length) {
                const idxLast = cols.indexOf('LAST'), idxWap = cols.indexOf('WAPRICE'), idxPrev = cols.indexOf('PREVPRICE');
                const pIdx = [idxLast, idxWap, idxPrev].find(i => i > -1 && rows[0][i] != null);
                if (pIdx !== undefined) lastPrice = rows[0][pIdx];
            }
            if (lastPrice != null) {
                holdings.forEach(h => {
                    if (h.name.toUpperCase() === t) {
                        if (h.type === 'bond') { if (face) h.face = face; h.cur = h.face ? lastPrice * h.face / 100 : lastPrice; } 
                        else h.cur = lastPrice;
                    }
                });
            }
        })());
    });
    await Promise.allSettled(tasks); save(); btn.disabled = false; btn.textContent = orig;
}

function exportData() {
    const dataStr = "data:text/json;charset=utf-8," + encodeURIComponent(JSON.stringify(holdings, null, 2));
    const a = document.createElement('a'); a.setAttribute("href", dataStr); a.setAttribute("download", "portfolio_backup.json"); a.click();
}
function importData(input) {
    const file = input.files[0]; if (!file) return;
    const reader = new FileReader();
    reader.onload = function(e) {
        try { const data = JSON.parse(e.target.result); if (Array.isArray(data)) { holdings = data; save(); alert('Данные загружены!'); } } catch { alert('Ошибка JSON'); }
    };
    reader.readAsText(file); input.value = '';
}

try { initSelects(); render(); setTimeout(checkLock, 100); } catch (e) { document.getElementById('mainApp').style.display = 'block'; }
