<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="theme-color" content="#000000">
<title>Портфель</title>
<style>
    body { background: #000; color: #fff; font-family: -apple-system, sans-serif; margin: 0; padding-bottom: 80px; }
    .header { padding: 20px; border-bottom: 1px solid #333; }
    h1 { margin: 0; font-size: 24px; }
    .balance { font-size: 32px; font-weight: bold; margin: 10px 0; }
    .green { color: #30d158; } .red { color: #ff453a; }
    
    .actions { display: flex; gap: 10px; padding: 15px; overflow-x: auto; }
    .btn { background: #1c1c1e; border: none; color: #fff; padding: 10px 15px; border-radius: 10px; white-space: nowrap; font-size: 14px; cursor: pointer; }
    .btn-primary { background: #ffd60a; color: #000; font-weight: bold; }
    
    .list { padding: 0 15px; }
    .item { background: #1c1c1e; margin-bottom: 10px; padding: 15px; border-radius: 12px; display: flex; justify-content: space-between; align-items: center; }
    .item-info div:first-child { font-weight: 600; margin-bottom: 4px; }
    .item-info div:last-child { font-size: 12px; color: #8e8e93; }
    .item-val { text-align: right; }
    
    /* Modal & Overlay */
    .modal { display: none; position: fixed; inset: 0; background: rgba(0,0,0,0.8); z-index: 100; align-items: flex-end; justify-content: center; }
    .modal.open { display: flex; }
    .modal-content { background: #1c1c1e; width: 100%; max-height: 80vh; border-radius: 20px 20px 0 0; padding: 20px; overflow-y: auto; animation: slideUp 0.3s; }
    @keyframes slideUp { from { transform: translateY(100%); } to { transform: translateY(0); } }
    
    .overlay { display: none; position: fixed; inset: 0; background: #000; z-index: 200; flex-direction: column; align-items: center; justify-content: center; }
    .overlay.active { display: flex; }
    .spinner { width: 40px; height: 40px; border: 4px solid #333; border-top-color: #ffd60a; border-radius: 50%; animation: spin 1s linear infinite; margin-bottom: 20px; }
    @keyframes spin { to { transform: rotate(360deg); } }
    
    input, select { width: 100%; padding: 12px; background: #2c2c2e; border: none; border-radius: 8px; color: #fff; margin-bottom: 10px; box-sizing: border-box; }
    label { display: block; margin-bottom: 5px; color: #8e8e93; font-size: 12px; }
</style>
</head>
<body>

<div class="header">
    <div style="font-size: 12px; color: #8e8e93;">ОБЩИЙ КАПИТАЛ</div>
    <div class="balance" id="totalBalance">0 ₽</div>
    <div id="totalProfit" class="green">+0 ₽ (0%)</div>
</div>

<div class="actions">
    <button class="btn btn-primary" onclick="startBatchOCR()">📷 Массовая загрузка</button>
    <button class="btn" onclick="updatePrices()">↻ Цены</button>
    <button class="btn" onclick="clearData()" style="color:#ff453a">🗑 Сброс</button>
    <input type="file" id="fileInput" multiple accept="image/*" style="display:none" onchange="handleFiles(this)">
</div>

<div class="list" id="portfolioList"></div>

<!-- Модальное окно добавления вручную -->
<div class="modal" id="addModal">
    <div class="modal-content">
        <h3>Добавить актив</h3>
        <label>Владелец</label>
        <select id="newOwner"><option value="Дмитрий">Дмитрий</option><option value="Аксана">Аксана</option></select>
        <label>Тикер / Название</label>
        <input type="text" id="newName" placeholder="SBER">
        <label>Количество</label>
        <input type="number" id="newQty" placeholder="10">
        <label>Цена покупки</label>
        <input type="number" id="newPrice" placeholder="100">
        <button class="btn btn-primary" style="width:100%" onclick="addManual()">Сохранить</button>
        <button class="btn" style="width:100%; margin-top:10px" onclick="closeModal('addModal')">Отмена</button>
    </div>
</div>

<!-- Модальное окно распределения (после OCR) -->
<div class="modal" id="reviewModal">
    <div class="modal-content">
        <h3>Распределить активы</h3>
        <p style="color:#8e8e93; font-size:14px">Найдено бумаг. Кому добавить?</p>
        <div id="reviewList" style="margin-bottom: 20px; max-height: 200px; overflow-y:auto;"></div>
        <button class="btn" style="width:100%; background:#0a84ff; color:white; margin-bottom:10px" onclick="assignTo('Дмитрий')">➕ Дмитрию</button>
        <button class="btn" style="width:100%; background:#30d158; color:black" onclick="assignTo('Аксана')">➕ Аксане</button>
        <button class="btn" style="width:100%; margin-top:10px" onclick="closeModal('reviewModal')">Отмена</button>
    </div>
</div>

<!-- Экран загрузки OCR -->
<div class="overlay" id="ocrOverlay">
    <div class="spinner"></div>
    <div id="ocrStatus" style="color:white; font-size:16px">Обработка...</div>
    <button class="btn" style="margin-top:20px" onclick="stopOCR()">Стоп</button>
</div>

<script src="https://cdn.jsdelivr.net/npm/tesseract.js@5/dist/tesseract.min.js"></script>
<script>
// === ДАННЫЕ ===
let portfolio = JSON.parse(localStorage.getItem('myPortfolio')) || [];
let tempScanResults = [];
let isScanning = false;

const TICKERS = {
    'сбер': 'SBER', 'сбербанк': 'SBER', 'втб': 'VTBR', 'газпром': 'GAZP', 
    'лукойл': 'LKOH', 'новатэк': 'NVTK', 'татнефть': 'TATN', 'транснефть': 'TRNFP',
    'мосбиржа': 'MOEX', 'яндекс': 'YDEX', 'ростелеком': 'RTKM', 'аэрофлот': 'AFLT',
    'сургут': 'SNGSP', 'полюс': 'PLZL', 'норникель': 'GMKN', 'интер рао': 'IRAO',
    'икс 5': 'X5', 'дом.рф': 'DOMRF', 'лежебоки': 'LEZHEBOKI', 'офз': 'BOND'
};

// === ИНИЦИАЛИЗАЦИЯ ===
function init() {
    render();
}

function save() {
    localStorage.setItem('myPortfolio', JSON.stringify(portfolio));
    render();
}

function render() {
    const list = document.getElementById('portfolioList');
    let totalVal = 0;
    let totalCost = 0;
    
    // Группировка для отображения
    const grouped = {};
    portfolio.forEach(p => {
        if (!grouped[p.name]) grouped[p.name] = {...p, qty: 0, cost: 0, val: 0, owner: p.owner};
        grouped[p.name].qty += Number(p.qty);
        grouped[p.name].cost += (Number(p.qty) * Number(p.price));
        grouped[p.name].val += (Number(p.qty) * Number(p.cur || p.price));
    });

    let html = '';
    Object.values(grouped).forEach(item => {
        totalVal += item.val;
        totalCost += item.cost;
        const profit = item.val - item.cost;
        const pct = item.cost > 0 ? ((profit/item.cost)*100).toFixed(2) : 0;
        const colorClass = profit >= 0 ? 'green' : 'red';
        
        html += `
        <div class="item">
            <div class="item-info">
                <div>${item.name} <span style="font-size:10px; color:#666">(${item.owner})</span></div>
                <div>${item.qty} шт. • Ср. ${Number(item.price).toFixed(2)} ₽</div>
            </div>
            <div class="item-val">
                <div style="font-weight:bold">${Math.round(item.val).toLocaleString()} ₽</div>
                <div class="${colorClass}" style="font-size:12px">${profit > 0 ? '+' : ''}${Math.round(profit).toLocaleString()} (${pct}%)</div>
            </div>
        </div>`;
    });

    if (portfolio.length === 0) html = '<div style="text-align:center; color:#555; margin-top:50px">Портфель пуст.<br>Нажмите "Массовая загрузка"</div>';
    
    list.innerHTML = html;
    
    const totalProfit = totalVal - totalCost;
    const totalPct = totalCost > 0 ? ((totalProfit/totalCost)*100).toFixed(2) : 0;
    
    document.getElementById('totalBalance').innerText = Math.round(totalVal).toLocaleString() + ' ₽';
    const pEl = document.getElementById('totalProfit');
    pEl.innerText = `${totalProfit > 0 ? '+' : ''}${Math.round(totalProfit).toLocaleString()} ₽ (${totalPct}%)`;
    pEl.className = totalProfit >= 0 ? 'green' : 'red';
}

// === РУЧНОЕ ДОБАВЛЕНИЕ ===
function openAddModal() { document.getElementById('addModal').classList.add('open'); }
function closeModal(id) { document.getElementById(id).classList.remove('open'); }

function addManual() {
    const name = document.getElementById('newName').value.toUpperCase();
    const qty = document.getElementById('newQty').value;
    const price = document.getElementById('newPrice').value;
    const owner = document.getElementById('newOwner').value;
    
    if(name && qty) {
        portfolio.push({ id: Date.now(), name, qty, price, cur: price, owner });
        save();
        closeModal('addModal');
        // Очистка полей
        document.getElementById('newName').value = '';
        document.getElementById('newQty').value = '';
    }
}

function clearData() {
    if(confirm('Удалить весь портфель?')) {
        portfolio = [];
        save();
    }
}

// === МАССОВАЯ ЗАГРУЗКА (OCR) ===
function startBatchOCR() {
    if (typeof Tesseract === 'undefined') {
        alert('Загрузка движка... Подождите 5 сек и попробуйте снова.');
        return;
    }
    document.getElementById('fileInput').click();
}

async function handleFiles(input) {
    const files = Array.from(input.files);
    if (files.length === 0) return;

    isScanning = true;
    tempScanResults = []; // Очищаем буфер
    const overlay = document.getElementById('ocrOverlay');
    const status = document.getElementById('ocrStatus');
    overlay.classList.add('active');

    // Создаем воркер один раз
    const worker = await Tesseract.createWorker('rus');

    for (let i = 0; i < files.length; i++) {
        if (!isScanning) break;
        status.innerText = `Сканирование ${i+1} из ${files.length}...`;
        
        try {
            const { data: { text } } = await worker.recognize(files[i]);
            parseText(text);
        } catch(e) { console.error(e); }
    }

    await worker.terminate();
    overlay.classList.remove('active');
    isScanning = false;
    input.value = ''; // сброс инпута

    if (tempScanResults.length > 0) {
        showReviewModal();
    } else {
        alert('Ничего не удалось распознать. Попробуйте более четкие скриншоты.');
    }
}

function stopOCR() {
    isScanning = false;
    document.getElementById('ocrOverlay').classList.remove('active');
}

function parseText(text) {
    const lines = text.split('\n');
    lines.forEach(line => {
        const lower = line.toLowerCase();
        let foundTicker = null;
        
        // Поиск тикера
        for (const [key, ticker] of Object.entries(TICKERS)) {
            if (lower.includes(key)) {
                foundTicker = ticker === 'BOND' ? extractBond(line) : ticker;
                break;
            }
        }

        if (foundTicker) {
            // Поиск количества (число перед "шт")
            const qtyMatch = line.match(/(\d[\d\s]*)\s*шт/i) || line.match(/(\d+)\s*(акция|лот)/i);
            let qty = 0;
            
            if (qtyMatch) {
                qty = parseInt(qtyMatch[1].replace(/\s/g, ''));
            } else {
                // Если "шт" нет, ищем просто большое число в конце строки (эвристика)
                const nums = line.match(/\d+/g);
                if (nums) {
                    // Берем самое большое число, которое не похоже на цену (цена обычно меньше)
                    // Это грубая эвристика, но лучше чем ничего
                    const maxNum = Math.max(...nums.map(Number));
                    if (maxNum > 10) qty = maxNum; 
                }
            }

            if (qty > 0) {
                // Проверяем, есть ли уже такой тикер в буфере
                const existing = tempScanResults.find(r => r.name === foundTicker);
                if (existing) {
                    existing.qty += qty;
                } else {
                    tempScanResults.push({ name: foundTicker, qty: qty, price: 0 });
                }
            }
        }
    });
}

function extractBond(line) {
    const match = line.match(/26\d{3}/);
    return match ? `ОФЗ-${match[0]}` : 'ОФЗ';
}

function showReviewModal() {
    const list = document.getElementById('reviewList');
    list.innerHTML = tempScanResults.map(r => 
        `<div style="padding:10px; border-bottom:1px solid #333; display:flex; justify-content:space-between">
            <b>${r.name}</b> <span>${r.qty} шт.</span>
        </div>`
    ).join('');
    document.getElementById('reviewModal').classList.add('open');
}

function assignTo(owner) {
    tempScanResults.forEach(item => {
        // Проверяем, есть ли уже такая бумага у этого владельца
        const existing = portfolio.find(p => p.name === item.name && p.owner === owner);
        if (existing) {
            existing.qty = Number(existing.qty) + item.qty;
        } else {
            portfolio.push({
                id: Date.now() + Math.random(),
                name: item.name,
                qty: item.qty,
                price: 0, // Цену придется вбить руками
                cur: 0,
                owner: owner
            });
        }
    });
    save();
    closeModal('reviewModal');
    tempScanResults = [];
    alert(`Добавлено владельцу: ${owner}`);
}

// === ОБНОВЛЕНИЕ ЦЕН (MOEX API) ===
async function updatePrices() {
    const btn = document.querySelector('.btn-primary'); // берем первую кнопку для индикации
    const oldText = btn.innerText;
    btn.innerText = 'Загрузка...';
    
    const uniqueNames = [...new Set(portfolio.map(p => p.name))];
    
    for (const name of uniqueNames) {
        if (name.startsWith('ОФЗ')) continue; // Облигации сложнее парсить в простом режиме
        
        try {
            // Запрос к MOEX ISS
            const resp = await fetch(`https://iss.moex.com/iss/engines/stock/markets/shares/boards/TQBR/securities/${name}.json`);
            const data = await resp.json();
            
            if (data.marketdata && data.marketdata.data.length > 0) {
                const columns = data.marketdata.columns;
                const lastPriceIndex = columns.indexOf('LAST');
                if (lastPriceIndex !== -1) {
                    const price = data.marketdata.data[0][lastPriceIndex];
                    // Обновляем цену у всех владельцев этой бумаги
                    portfolio.forEach(p => {
                        if (p.name === name) p.cur = price;
                    });
                }
            }
        } catch(e) { console.log('Ошибка загрузки ' + name); }
    }
    
    save();
    btn.innerText = oldText;
}

// Запуск
init();
</script>
</body>
</html>
