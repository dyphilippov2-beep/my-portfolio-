<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="theme-color" content="#000000">
<title>Мой Портфель</title>
<style>
:root { 
    --bg:#000; --card:#1c1c1e; --text:#fff; --green:#30d158; --red:#ff453a; --yellow:#ffd60a; --gray:#8e8e93; --border:#38383a; 
    --blue: #0a84ff;
}
* { box-sizing:border-box; -webkit-tap-highlight-color:transparent; outline: none; }
body { margin:0; background:var(--bg); color:var(--text); font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif; padding-bottom:120px; overflow-x: hidden; }

/* Lock Screen */
#lockScreen { position: fixed; inset: 0; background: #000; z-index: 9999; display: none; flex-direction: column; align-items: center; justify-content: center; backdrop-filter: blur(10px); }
.lock-icon { font-size: 64px; margin-bottom: 20px; animation: pulse 2s infinite; }
@keyframes pulse { 0% { opacity: 0.5; } 50% { opacity: 1; } 100% { opacity: 0.5; } }
.lock-title { font-size: 22px; font-weight: 600; margin-bottom: 40px; }
#pinPad { display: none; flex-direction: column; align-items: center; width: 100%; max-width: 300px; }
#pinDots { display: flex; gap: 20px; margin-bottom: 40px; }
.dot { width: 14px; height: 14px; border-radius: 50%; background: #333; border: 1px solid #555; transition: all 0.2s; }
.dot.filled { background: var(--text); border-color: var(--text); transform: scale(1.1); }
.pin-grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 20px; }
.pin-btn { width: 70px; height: 70px; border-radius: 50%; background: rgba(255,255,255,0.1); color: #fff; font-size: 28px; font-weight: 400; border: none; cursor: pointer; display: flex; align-items: center; justify-content: center; transition: background 0.2s; }
.pin-btn:active { background: rgba(255,255,255,0.3); }
.pin-btn.del { font-size: 20px; background: transparent; }

/* Main UI */
.header { padding:calc(20px + env(safe-area-inset-top)) 20px 10px; position: relative; background: linear-gradient(to bottom, rgba(20,20,20,1), rgba(0,0,0,0)); }
.settings-btn { position: absolute; top: calc(15px + env(safe-area-inset-top)); right: 20px; font-size: 24px; cursor: pointer; background: none; border: none; color: var(--blue); opacity: 0.9; z-index: 10; }
.label { font-size:13px; color:var(--gray); text-transform:uppercase; letter-spacing:.5px; font-weight: 500; }
.balance { font-size:42px; font-weight:700; margin:8px 0; letter-spacing:-1px; line-height: 1.1; }
.profit-row { display:flex; align-items:center; gap:8px; font-size:15px; font-weight:600; flex-wrap:wrap; margin-bottom: 10px; }
.green { color:var(--green); } .red { color:var(--red); }

/* Filters & Actions */
.owners-filter { display:flex; gap:10px; padding:10px 20px 15px; overflow-x:auto; scrollbar-width:none; -webkit-overflow-scrolling: touch; }
.owners-filter::-webkit-scrollbar { display:none; }
.owner-btn { background:rgba(255,255,255,0.1); border:1px solid transparent; color:var(--gray); padding:8px 18px; border-radius:20px; font-size:14px; font-weight:600; white-space:nowrap; cursor:pointer; transition: all 0.2s; }
.owner-btn.active { background:var(--text); color:var(--bg); border-color:var(--text); box-shadow: 0 4px 12px rgba(255,255,255,0.2); }

.actions { display:flex; gap:10px; padding:0 20px 20px; overflow-x:auto; scrollbar-width:none; }
.btn { background:rgba(255,255,255,0.1); border:none; color:var(--text); padding:10px 16px; border-radius:12px; font-size:14px; font-weight:600; white-space:nowrap; display:flex; align-items:center; gap:6px; cursor:pointer; transition: background 0.2s; }
.btn:active { transform: scale(0.96); }
.btn-moex { color:var(--yellow); }

/* Groups & Cards */
.group-wrap { margin:0 20px 12px; border-radius:16px; background:var(--card); overflow:hidden; border: 1px solid var(--border); transition: transform 0.2s; }
.group-header { padding:16px; display:flex; align-items:center; gap:14px; cursor:pointer; position:relative; }
.icon-box { width:40px; height:40px; border-radius:12px; display:flex; align-items:center; justify-content:center; font-size:18px; font-weight:bold; flex-shrink:0; background: rgba(255,255,255,0.05); }
.info { flex:1; min-width:0; }
.name { font-size:16px; font-weight:600; margin-bottom:3px; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; display:flex; align-items:center; gap:6px; }
.details { font-size:12px; color:var(--gray); }
.values { text-align:right; flex-shrink:0; }
.val { font-size:16px; font-weight:700; margin-bottom:3px; }
.change { font-size:12px; font-weight:600; padding: 2px 6px; border-radius: 6px; background: rgba(0,0,0,0.2); }

.group-body { display:none; background:#2c2c2e; border-top:1px solid var(--border); padding:0 16px; }
.group-body.active { display:block; animation: slideDown 0.2s ease-out; }
@keyframes slideDown { from { opacity: 0; transform: translateY(-5px); } to { opacity: 1; transform: translateY(0); } }

.acc-row { display:flex; justify-content:space-between; align-items:center; padding:14px 0; border-bottom:1px solid rgba(255,255,255,0.05); font-size:14px; cursor:pointer; }
.acc-row:last-child { border-bottom:none; }
.acc-info { display:flex; flex-direction:column; }
.acc-name { font-weight:500; color: #fff; }
.acc-owner { font-size:11px; color:var(--gray); margin-top: 2px; }
.acc-values { text-align:right; display:flex; align-items:center; gap:10px; }
.edit-icon { color:var(--blue); font-size:18px; padding: 5px; }

/* Bottom Bar & Modal */
.bottom-bar { position:fixed; bottom:0; left:0; right:0; background:rgba(28,28,30,.9); backdrop-filter:blur(20px); padding:15px 20px calc(25px + env(safe-area-inset-bottom)); display:flex; gap:15px; border-top:.5px solid #38383a; z-index:50; }
.fab { flex:1; background:var(--yellow); color:#000; border:none; padding:16px; border-radius:16px; font-size:17px; font-weight:700; cursor:pointer; display: flex; align-items: center; justify-content: center; box-shadow: 0 4px 20px rgba(255, 214, 10, 0.3); transition: transform 0.1s; }
.fab:active { transform: scale(0.98); opacity: 0.9; }

.modal { display:none; position:fixed; inset:0; background:rgba(0,0,0,.6); z-index:100; align-items:flex-end; justify-content: center; backdrop-filter: blur(5px); }
.modal.active { display:flex; }
.modal-content { background:#1c1c1e; width:100%; max-width: 600px; max-height:90vh; border-radius:24px 24px 0 0; padding:24px 20px 40px; overflow-y:auto; animation:slideUp .3s cubic-bezier(.4,0,.2,1); position:relative; border-top: 1px solid #333; }
@keyframes slideUp { from { transform:translateY(100%); } to { transform:translateY(0); } }

input[type="text"], input[type="number"], select { width:100%; padding:16px; background:#2c2c2e; border:1px solid #3a3a3c; border-radius:14px; color:#fff; font-size:16px; margin-bottom:16px; box-sizing:border-box; outline:none; transition: border-color 0.2s; }
input:focus, select:focus { border-color: var(--yellow); }
label { display:block; font-size:13px; color:var(--gray); margin-bottom:8px; font-weight:500; margin-left: 4px; }
.close-btn { position:absolute; top:16px; right:20px; width:30px; height:30px; border-radius:50%; background:#3a3a3c; border:none; color:#fff; font-size:14px; cursor:pointer; display: flex; align-items: center; justify-content: center; }

.empty-state { text-align:center; padding:80px 40px; color:var(--gray); font-size:16px; line-height:1.6; }
.delete-btn { background: var(--red); color: white; width: 100%; margin-top: 10px; }

/* Settings & Switch */
.settings-row { display: flex; justify-content: space-between; align-items: center; padding: 18px 0; border-bottom: 1px solid var(--border); }
.switch { position: relative; display: inline-block; width: 52px; height: 32px; }
.switch input { opacity: 0; width: 0; height: 0; }
.slider { position: absolute; cursor: pointer; top: 0; left: 0; right: 0; bottom: 0; background-color: #3a3a3c; transition: .4s; border-radius: 34px; }
.slider:before { position: absolute; content: ""; height: 28px; width: 28px; left: 2px; bottom: 2px; background-color: white; transition: .4s; border-radius: 50%; }
input:checked + .slider { background-color: var(--green); }
input:checked + .slider:before { transform: translateX(20px); }

/* OCR Overlay */
.ocr-overlay { display:none; position:fixed; inset:0; background:rgba(0,0,0,.95); z-index:200; flex-direction:column; align-items:center; justify-content:center; gap:20px; }
.spinner { width:40px; height:40px; border:3px solid #333; border-top-color:var(--yellow); border-radius:50%; animation:spin .8s linear infinite; }
@keyframes spin { to { transform:rotate(360deg); } }
</style>
</head>
<body>

<!-- LOCK SCREEN -->
<div id="lockScreen">
    <div class="lock-icon">🔒</div>
    <div class="lock-title">Портфель защищен</div>
    <div id="unlockMethods" style="display: flex; flex-direction: column; gap: 15px; width: 100%; align-items: center;">
        <button class="fab" onclick="tryFaceId()" style="width: 260px; display: none; background: var(--blue); color: white;" id="btnFaceIdUnlock">Face ID</button>
        <button class="btn" onclick="showPin()" style="background: #333; width: 260px; display: none; justify-content: center; height: 50px;" id="btnPinUnlock">Ввести PIN</button>
    </div>
    <div id="pinPad">
        <div id="pinDots"><div class="dot"></div><div class="dot"></div><div class="dot"></div><div class="dot"></div></div>
        <div class="pin-grid">
            <button class="pin-btn" onclick="pinInput('1')">1</button><button class="pin-btn" onclick="pinInput('2')">2</button><button class="pin-btn" onclick="pinInput('3')">3</button>
            <button class="pin-btn" onclick="pinInput('4')">4</button><button class="pin-btn" onclick="pinInput('5')">5</button><button class="pin-btn" onclick="pinInput('6')">6</button>
            <button class="pin-btn" onclick="pinInput('7')">7</button><button class="pin-btn" onclick="pinInput('8')">8</button><button class="pin-btn" onclick="pinInput('9')">9</button>
            <button class="pin-btn" style="visibility: hidden;"></button><button class="pin-btn" onclick="pinInput('0')">0</button><button class="pin-btn del" onclick="pinInput('del')">⌫</button>
        </div>
    </div>
</div>

<!-- MAIN APP -->
<div id="mainApp" style="display: none;">
    <div class="header">
        <button class="settings-btn" onclick="document.getElementById('settingsModal').classList.add('active')">⚙️</button>
        <div class="label">Общий капитал</div>
        <div class="balance" id="totalBalance">0 ₽</div>
        <div class="profit-row">
            <span id="totalProfit">0 ₽</span>
            <span id="totalPct" style="opacity: 0.7">0%</span>
        </div>
    </div>

    <div class="owners-filter" id="ownersFilter"></div>
    
    <div class="actions">
        <button class="btn btn-moex" onclick="updateMarkets()">↻ Обновить цены</button>
        <button class="btn" onclick="triggerOCR()">📷 Скриншот</button>
        <button class="btn" onclick="exportData()">💾 Бэкап</button>
        <input type="file" id="ocrInput" accept="image/*" style="display:none" onchange="processOCR(this)">
        <input type="file" id="importFile" accept=".json" style="display:none" onchange="importData(this)">
    </div>

    <div id="appContent"></div>

    <div class="bottom-bar">
        <button class="fab" onclick="openModal()">＋ Добавить актив</button>
    </div>
</div>

<!-- ADD/EDIT MODAL -->
<div class="modal" id="addModal">
    <div class="modal-content">
        <button class="close-btn" onclick="closeModal()">✕</button>
        <h2 id="modalTitle" style="margin:0 0 25px; font-size:24px;">Новый актив</h2>
        
        <label>Счёт</label>
        <select id="assetAccount"></select>
        
        <label>Тип актива</label>
        <select id="assetType" onchange="toggleFields()">
            <option value="stock">Акция РФ</option>
            <option value="bond">Облигация / ОФЗ</option>
            <option value="gold">Золото (монеты)</option>
            <option value="cash">Наличные</option>
            <option value="crypto">Криптовалюта</option>
        </select>
        
        <label id="nameLabel">Тикер / Название</label>
        <input type="text" id="assetName" placeholder="SBER" autocomplete="off" autocapitalize="characters">
        
        <label id="qtyLabel">Количество</label>
        <input type="text" id="assetQty" placeholder="0" inputmode="decimal">
        
        <label id="priceLabel">Средняя цена покупки (₽)</label>
        <input type="text" id="assetPrice" placeholder="0" inputmode="decimal">
        
        <div id="curPriceBlock">
            <label>Текущая цена (необязательно)</label>
            <input type="text" id="assetCur" placeholder="Рынок обновит сам" inputmode="decimal">
        </div>

        <button class="fab" style="margin-top:10px; width:100%" onclick="saveAsset()">Сохранить</button>
        <button class="btn delete-btn" id="deleteBtn" style="display:none" onclick="deleteAsset()">Удалить актив</button>
    </div>
</div>

<!-- SETTINGS MODAL -->
<div class="modal" id="settingsModal">
    <div class="modal-content">
        <button class="close-btn" onclick="document.getElementById('settingsModal').classList.remove('active')">✕</button>
        <h2 style="margin:0 0 20px; font-size:22px;">Настройки</h2>
        
        <div class="settings-row">
            <span>Защита при входе</span>
            <label class="switch"><input type="checkbox" id="toggleProtection" onchange="toggleProtection()"><span class="slider"></span></label>
        </div>
        
        <button class="btn" onclick="registerFaceId()" style="width: 100%; justify-content: center; margin-top: 20px; background: #2c2c2e; height: 50px;">😊 Настроить Face ID</button>
        <button class="btn" onclick="setupPin()" style="width: 100%; justify-content: center; margin-top: 10px; background: #2c2c2e; height: 50px;">🔢 Изменить PIN-код</button>
        <button class="btn" onclick="document.getElementById('importFile').click()" style="width: 100%; justify-content: center; margin-top: 20px; background: #2c2c2e; height: 50px;">📥 Восстановить из файла</button>
        
        <div style="margin-top: 30px; text-align: center; color: var(--gray); font-size: 12px;">
            Portfolio App v2.1<br>Data stored locally
        </div>
    </div>
</div>

<!-- OCR OVERLAY -->
<div class="ocr-overlay" id="ocrOverlay">
    <div class="spinner"></div>
    <div style="color:#fff; font-size:16px; text-align:center; padding:0 20px;" id="ocrText">Загрузка нейросети...</div>
    <button class="btn" onclick="document.getElementById('ocrOverlay').classList.remove('active')" style="margin-top: 20px; background: rgba(255,255,255,0.2);">Отмена</button>
</div>

<script async src="https://cdn.jsdelivr.net/npm/tesseract.js@5/dist/tesseract.min.js"></script>
<script>
// === КОНФИГУРАЦИЯ ===
const ACCOUNTS = {
    'acc1': { name: 'Сбер Инвест (Основной)', owner: 'Дмитрий' },
    'acc2': { name: 'Т-Инвестиции', owner: 'Дмитрий' },
    'acc3': { name: 'Сбер Инвест', owner: 'Аксана' },
    'acc4': { name: 'Т-Инвестиции', owner: 'Аксана' },
    'acc5': { name: 'Наличные / Сейф', owner: 'Общее' }
};

// Расширенный словарь для OCR (включая опечатки)
const TICKER_MAP = {
    'сбербанк': 'SBER', 'сбер': 'SBER', 'сбербанк россии': 'SBER', 'сбер 6анк': 'SBER',
    'газпром': 'GAZP', 'газп': 'GAZP',
    'лукойл': 'LKOH', 'лукоил': 'LKOH', 'lukoil': 'LKOH',
    'норникель': 'GMKN', 'норильский никель': 'GMKN',
    'роснефть': 'ROSN', 'татнефть': 'TATN', 'татнефть ап': 'TATNP',
    'тинькофф': 'T', 'т-технологии': 'T', 'т банк': 'T',
    'яндекс': 'YDEX', 'yandex': 'YDEX',
    'мосбиржа': 'MOEX', 'moex': 'MOEX',
    'аэрофлот': 'AFLT', 'втб': 'VTBR',
    'северсталь': 'CHMF', 'ммк': 'MAGN', 'нкхз': 'NKNC',
    'новатэк': 'NVTK', 'полюс': 'PLZL',
    'сургутнефтегаз': 'SNGS', 'сургутнефтегаз ао': 'SNGSP',
    'транснефть': 'TRNFP', 'транснефть п': 'TRNFP',
    'фосагро': 'PHOR', 'мтс': 'MTSS', 'магнит': 'MGNT',
    'икс 5': 'X5', 'x5 group': 'X5', 'корп центр': 'X5',
    'головешки': 'LEZHEBOKI', 'лежебоки': 'LEZHEBOKI', 'fond lezheboki': 'LEZHEBOKI',
    'озон': 'OZON', 'озон холдингс': 'OZON',
    'калибр': 'CLBR', 'фонд калибр': 'CLBR',
    'алроса': 'ALRS', 'алроса алр': 'ALRS',
    'ростелеком': 'RTKM', 'рткм': 'RTKM', 'ростелеком ап': 'RTKMP'
};

const CONFIG = {
    stock: { icon:'📈', color:'#0a84ff' }, bond: { icon:'📄', color:'#ff9f0a' },
    gold: { icon:'🪙', color:'#ffd60a' }, cash: { icon:'💵', color:'#30d158' }, crypto: { icon:'₿', color:'#bf5af2' }
};

// === STATE ===
let holdings = [];
let appSettings = { protected: false, hasPin: false, hasFaceId: false };
let currentFilter = 'Все';
let expandedGroups = new Set();
let editingId = null;

// === UTILS ===
const uid = () => Date.now().toString(36) + Math.random().toString(36).slice(2,6);
const fmt = n => n.toLocaleString('ru-RU', { minimumFractionDigits:2, maximumFractionDigits:2 }) + ' ₽';
const num = v => { if (typeof v === 'number') return v; const s = String(v ?? '').trim().replace(/\s+/g, '').replace(',', '.'); const n = parseFloat(s); return Number.isFinite(n) ? n : 0; };

// Простое хеширование для PIN (не криптографическое, но лучше открытого текста)
const hashPin = pin => btoa(pin.split('').reverse().join('') + 'salt_portfolio');

// === INITIALIZATION ===
function init() {
    // Load Data
    try { 
        let saved = JSON.parse(localStorage.getItem('portfolio_v7')); 
        if (Array.isArray(saved)) holdings = saved; 
    } catch(e) { console.error("Load error", e); }
    
    // Load Auth
    try { 
        let savedAuth = JSON.parse(localStorage.getItem('portfolio_auth')); 
        if (savedAuth) appSettings = savedAuth; 
    } catch(e) {}

    initSelects();
    render();
    checkLock();
}

// === SECURITY ===
function saveSettings() { localStorage.setItem('portfolio_auth', JSON.stringify(appSettings)); }

function toggleProtection() {
    const isChecked = document.getElementById('toggleProtection').checked;
    if (isChecked) {
        if (!appSettings.hasPin && !appSettings.hasFaceId) {
            alert('Сначала настройте PIN или Face ID!');
            document.getElementById('toggleProtection').checked = false; return;
        }
        appSettings.protected = true;
    } else { appSettings.protected = false; }
    saveSettings();
}

function setupPin() {
    const pin = prompt('Введите новый 4-значный PIN-код:');
    if (pin && /^\d{4}$/.test(pin)) {
        localStorage.setItem('portfolio_pin_hash', hashPin(pin)); 
        appSettings.hasPin = true; 
        saveSettings(); 
        alert('PIN-код успешно установлен.');
    } else if (pin !== null) { alert('Ошибка: PIN должен состоять ровно из 4 цифр.'); }
}

async function registerFaceId() {
    if (!window.PublicKeyCredential) return alert('Ваш браузер не поддерживает биометрию (WebAuthn). Используйте Safari или Chrome последних версий.');
    try {
        const challenge = new Uint8Array(32); crypto.getRandomValues(challenge);
        const userId = new Uint8Array(16); crypto.getRandomValues(userId);
        const credential = await navigator.credentials.create({
            publicKey: {
                challenge, rp: { name: "Portfolio App", id: window.location.hostname || 'localhost' },
                user: { id: userId, name: "user", displayName: "Investor" },
                pubKeyCredParams: [{ alg: -7, type: "public-key" }, { alg: -257, type: "public-key" }],
                authenticatorSelection: { authenticatorAttachment: "platform", userVerification: "required" }, timeout: 60000
            }
        });
        if (credential) {
            localStorage.setItem('faceIdCredId', bufferToBase64(credential.rawId)); 
            appSettings.hasFaceId = true; 
            saveSettings(); 
            alert('Face ID / Touch ID успешно настроен!');
        }
    } catch (e) { alert('Ошибка настройки: ' + e.message + '\n\nУбедитесь, что сайт открыт через HTTPS или localhost.'); }
}

const bufferToBase64 = buf => btoa(String.fromCharCode(...new Uint8Array(buf)));
const base64ToBuffer = str => Uint8Array.from(atob(str), c => c.charCodeAt(0));

async function tryFaceId() {
    const credId = localStorage.getItem('faceIdCredId'); if (!credId) return;
    try {
        const challenge = new Uint8Array(32); crypto.getRandomValues(challenge);
        const assertion = await navigator.credentials.get({
            publicKey: { challenge, rpId: window.location.hostname || 'localhost', allowCredentials: [{ type: 'public-key', id: base64ToBuffer(credId) }], userVerification: "required", timeout: 60000 }
        });
        if (assertion) unlockApp();
    } catch (e) { 
        console.log(e);
        if (appSettings.hasPin) showPin(); 
    }
}

let pinInputBuffer = '';
function pinInput(val) {
    if (val === 'del') pinInputBuffer = pinInputBuffer.slice(0, -1);
    else if (pinInputBuffer.length < 4) pinInputBuffer += val;
    
    const dots = document.querySelectorAll('#pinDots .dot');
    dots.forEach((dot, i) => { 
        dot.classList.toggle('filled', i < pinInputBuffer.length); 
    });

    if (pinInputBuffer.length === 4) {
        const storedHash = localStorage.getItem('portfolio_pin_hash');
        if (hashPin(pinInputBuffer) === storedHash) {
            unlockApp();
        } else {
            navigator.vibrate?.(200);
            dots.forEach(d => d.style.background = '#ff453a');
            setTimeout(() => {
                pinInputBuffer = '';
                dots.forEach(d => { d.style.background = ''; d.classList.remove('filled'); });
            }, 300);
        }
    }
}

function showPin() { 
    document.getElementById('unlockMethods').style.display = 'none'; 
    document.getElementById('pinPad').style.display = 'flex'; 
    pinInputBuffer = '';
    document.querySelectorAll('.dot').forEach(d => d.classList.remove('filled'));
}

function unlockApp() { 
    document.getElementById('lockScreen').style.opacity = '0';
    setTimeout(() => {
        document.getElementById('lockScreen').style.display = 'none'; 
        document.getElementById('mainApp').style.display = 'block'; 
    }, 300);
    pinInputBuffer = '';
    document.getElementById('pinPad').style.display = 'none';
    document.getElementById('unlockMethods').style.display = 'flex';
}

function checkLock() {
    if (appSettings.protected) {
        document.getElementById('lockScreen').style.display = 'flex';
        if (appSettings.hasFaceId) document.getElementById('btnFaceIdUnlock').style.display = 'block';
        if (appSettings.hasPin) document.getElementById('btnPinUnlock').style.display = 'flex';
        document.getElementById('toggleProtection').checked = true;
    } else {
        document.getElementById('lockScreen').style.display = 'none';
        document.getElementById('mainApp').style.display = 'block';
        document.getElementById('toggleProtection').checked = false;
    }
}

// === RENDERING ===
function save() { localStorage.setItem('portfolio_v7', JSON.stringify(holdings)); render(); }

function renderFilters() {
    const owners = ['Все', ...new Set(Object.values(ACCOUNTS).map(a => a.owner))];
    document.getElementById('ownersFilter').innerHTML = owners.map(o => 
        `<button class="owner-btn ${currentFilter === o ? 'active' : ''}" onclick="setFilter('${o}')">${o}</button>`
    ).join('');
}

function setFilter(owner) { currentFilter = owner; render(); }

function render() {
    renderFilters();
    const filtered = holdings.filter(h => currentFilter === 'Все' || ACCOUNTS[h.accId]?.owner === currentFilter);
    
    // Grouping logic
    const grouped = {};
    filtered.forEach(h => {
        if (!grouped[h.name]) grouped[h.name] = { name: h.name, type: h.type, totalQty: 0, totalCost: 0, totalVal: 0, accounts: [] };
        const g = grouped[h.name];
        g.totalQty += h.qty; 
        g.totalCost += h.qty * (h.avg || 0); 
        g.totalVal += h.qty * (h.cur || 0); 
        g.accounts.push(h);
    });

    const groups = Object.values(grouped).sort((a, b) => b.totalVal - a.totalVal);
    
    // Totals
    let tv = 0, ti = 0; 
    groups.forEach(g => { tv += g.totalVal; ti += g.totalCost; });
    const pr = tv - ti; 
    const pc = ti > 0 ? (pr / ti) * 100 : 0;

    document.getElementById('totalBalance').textContent = fmt(tv);
    const pEl = document.getElementById('totalProfit'); 
    pEl.textContent = (pr >= 0 ? '+' : '') + fmt(pr); 
    pEl.className = pr >= 0 ? 'green' : 'red';
    
    const pctEl = document.getElementById('totalPct'); 
    pctEl.textContent = `${pc >= 0 ? '+' : ''}${pc.toFixed(2)}%`; 
    pctEl.className = pc >= 0 ? 'green' : 'red';

    if (!groups.length) { 
        document.getElementById('appContent').innerHTML = '<div class="empty-state">Портфель пуст<br><br>Нажмите «＋ Добавить актив»<br>или загрузите скриншот брокера</div>'; 
        return; 
    }

    document.getElementById('appContent').innerHTML = groups.map(g => {
        const cfg = CONFIG[g.type] || CONFIG.stock;
        const profit = g.totalVal - g.totalCost; 
        const pct = g.totalCost > 0 ? (profit / g.totalCost) * 100 : 0;
        const isExpanded = expandedGroups.has(g.name) ? 'active' : '';

        const accRows = g.accounts.map(h => {
            const acc = ACCOUNTS[h.accId] || { name: 'Неизвестный счет', owner: '-' };
            return `
            <div class="acc-row" onclick="editHolding('${h.id}')">
                <div class="acc-info"><span class="acc-name">${acc.name}</span><span class="acc-owner">${acc.owner}</span></div>
                <div class="acc-values">
                    <div style="text-align:right">
                        <div style="font-weight:600">${h.qty} ${g.type === 'cash' ? '₽' : 'шт.'}</div>
                        <div style="font-size:11px; color:var(--gray)">${fmt(h.qty * (h.cur || 0))}</div>
                    </div>
                    <div class="edit-icon">✎</div>
                </div>
            </div>`;
        }).join('');

        let details = `${g.totalQty} ${g.type === 'cash' ? '₽' : 'шт.'}`;
        if (g.type === 'gold') details += ` • ~${(g.totalQty * 7.78).toFixed(1)} г`;

        return `
        <div class="group-wrap">
            <div class="group-header" onclick="toggleGroup('${g.name.replace(/'/g, "\\'")}')">
                <div class="icon-box" style="color:${cfg.color}">${cfg.icon}</div>
                <div class="info">
                    <div class="name">${g.name}</div>
                    <div class="details">${details}</div>
                </div>
                <div class="values">
                    <div class="val">${fmt(g.totalVal)}</div>
                    <div class="change ${profit >= 0 ? 'green' : 'red'}">${profit >= 0 ? '+' : ''}${pct.toFixed(1)}%</div>
                </div>
            </div>
            <div class="group-body ${isExpanded}">${accRows}</div>
        </div>`;
    }).join('');
}

function toggleGroup(name) { 
    if (expandedGroups.has(name)) expandedGroups.delete(name); 
    else expandedGroups.add(name); 
    render(); 
}

// === MODAL LOGIC ===
function initSelects() { 
    document.getElementById('assetAccount').innerHTML = Object.entries(ACCOUNTS).map(([id, acc]) => 
        `<option value="${id}">${acc.name}</option>`
    ).join(''); 
}

function toggleFields() {
    const t = document.getElementById('assetType').value;
    const nl = document.getElementById('nameLabel'), ni = document.getElementById('assetName');
    const pl = document.getElementById('priceLabel');
    const curBlock = document.getElementById('curPriceBlock');

    if (t === 'gold') { nl.textContent = 'Название монеты'; ni.placeholder = 'Георгий Победоносец'; }
    else if (t === 'cash') { nl.textContent = 'Валюта'; ni.placeholder = 'Рубли'; pl.textContent = 'Курс (обычно 1)'; curBlock.style.display = 'none'; }
    else if (t === 'crypto') { nl.textContent = 'Тикер'; ni.placeholder = 'BTC'; curBlock.style.display = 'block'; }
    else { nl.textContent = 'Тикер / Название'; ni.placeholder = 'SBER'; curBlock.style.display = 'block'; }
}

function openModal() { 
    editingId = null; 
    document.getElementById('modalTitle').textContent = 'Новый актив'; 
    document.getElementById('deleteBtn').style.display = 'none';
    ['assetName','assetQty','assetPrice','assetCur'].forEach(id => document.getElementById(id).value = ''); 
    document.getElementById('assetType').value = 'stock';
    toggleFields(); 
    document.getElementById('addModal').classList.add('active'); 
}

function editHolding(id) {
    const h = holdings.find(x => x.id === id); if (!h) return;
    editingId = id; 
    document.getElementById('modalTitle').textContent = 'Редактировать'; 
    document.getElementById('deleteBtn').style.display = 'block';
    
    document.getElementById('assetAccount').value = h.accId; 
    document.getElementById('assetType').value = h.type;
    document.getElementById('assetName').value = h.name; 
    document.getElementById('assetQty').value = h.qty;
    document.getElementById('assetPrice').value = h.avg; 
    document.getElementById('assetCur').value = h.cur || ''; 
    
    toggleFields();
    document.getElementById('addModal').classList.add('active');
}

function closeModal() { document.getElementById('addModal').classList.remove('active'); editingId = null; }

function deleteAsset() {
    if (!editingId) return;
    if (confirm('Удалить эту запись?')) {
        holdings = holdings.filter(h => h.id !== editingId);
        save();
        closeModal();
    }
}

function saveAsset() {
    const accId = document.getElementById('assetAccount').value;
    const type = document.getElementById('assetType').value;
    let name = document.getElementById('assetName').value.trim();
    let qty = num(document.getElementById('assetQty').value);
    let price = num(document.getElementById('assetPrice').value);
    let cur = num(document.getElementById('assetCur').value);

    if (!name || qty <= 0) return alert('Заполните название и количество');
    
    // Auto-detect ticker
    const lowerName = name.toLowerCase();
    if (TICKER_MAP[lowerName]) name = TICKER_MAP[lowerName];
    else if ((type === 'stock' || type === 'bond') && name.length < 6) name = name.toUpperCase();

    if (type === 'cash') { price = 1; cur = 1; }
    else if (!cur) cur = price; // Fallback

    if (editingId) {
        const h = holdings.find(x => x.id === editingId);
        if (h) Object.assign(h, { accId, type, name, qty, avg: price, cur });
    } else {
        holdings.push({ id: uid(), accId, type, name, qty, avg: price, cur });
    }
    save(); closeModal();
    if (type !== 'cash') updateMarkets();
}

// === OCR LOGIC ===
function triggerOCR() {
    if (typeof Tesseract === 'undefined') {
        alert('Библиотека OCR загружается... Попробуйте через 5 секунд.');
        return;
    }
    const accList = Object.keys(ACCOUNTS).map(k => `${k}: ${ACCOUNTS[k].name}`).join('\n');
    const accId = prompt(`Выберите счет для загрузки (введите код, например acc1):\n\n${accList}`, "acc1");
    if (accId && ACCOUNTS[accId]) { 
        window._ocrTargetAccount = accId; 
        document.getElementById('ocrInput').click(); 
    } else if (accId) alert('Неверный код счета');
}

async function processOCR(input) {
    const file = input.files[0]; if (!file) return;
    const overlay = document.getElementById('ocrOverlay');
    const textEl = document.getElementById('ocrText');
    overlay.classList.add('active'); 
    
    let worker = null;
    try {
        textEl.textContent = 'Подготовка изображения...';
        // Tesseract handles preprocessing reasonably well now, but we can pass options
        worker = await Tesseract.createWorker('rus+eng', 1, {
            logger: m => { 
                if (m.status === 'recognizing text') textEl.textContent = `Чтение: ${Math.round(m.progress * 100)}%`;
            }
        });
        
        const result = await worker.recognize(file);
        textEl.textContent = 'Поиск активов...';
        parseOCRResult(result.data.text, window._ocrTargetAccount);
    } catch(e) { 
        alert('Ошибка OCR: ' + e.message); 
    } finally { 
        if (worker) await worker.terminate();
        overlay.classList.remove('active'); 
        input.value = ''; 
    }
}

function parseOCRResult(text, targetAccId) {
    const lines = text.split('\n').map(l => l.trim()).filter(l => l.length > 2);
    let found = 0;
    let log = [];

    // Improved Regex for quantity detection
    // Matches patterns like "100 шт", "100шт", "100 shares" or just numbers near tickers
    const qtyRegex = /(\d[\d\s]*)\s*(шт|штук|share)/i;

    for (let line of lines) {
        let cleanLine = line.toLowerCase().replace(/[^a-zа-яё0-9]/g, '');
        let matchedTicker = null;
        let originalName = "";

        // 1. Check Dictionary
        for (const [key, ticker] of Object.entries(TICKER_MAP)) {
            const cleanKey = key.replace(/[^a-zа-яё0-9]/g, '');
            if (cleanLine.includes(cleanKey)) { 
                matchedTicker = ticker; 
                originalName = key;
                break; 
            }
        }

        // 2. Check OFZ specifically
        if (!matchedTicker && cleanLine.includes('офз')) {
            const m = line.match(/(\d{5})/);
            if (m) { matchedTicker = `SU${m[1]}RMFS4`; originalName = `ОФЗ ${m[1]}`; }
        }

        if (matchedTicker) {
            // Try to find quantity in this line or next 2 lines
            let searchArea = line;
            const idx = lines.indexOf(line);
            if (lines[idx+1]) searchArea += " " + lines[idx+1];
            
            const qMatch = searchArea.match(qtyRegex);
            let qty = 0;
            
            if (qMatch) {
                qty = parseInt(qMatch[1].replace(/\s/g, ''), 10);
            } else {
                // Heuristic: if no "шт", look for a standalone number at the end of the line
                const numMatch = line.match(/.*\s(\d+)$/);
                if (numMatch) qty = parseInt(numMatch[1], 10);
            }

            if (qty > 0) {
                // Check if already exists
                const existing = holdings.find(h => h.accId === targetAccId && h.name === matchedTicker);
                if (existing) {
                    existing.qty = qty; // Update qty
                } else {
                    holdings.push({ 
                        id: uid(), 
                        accId: targetAccId, 
                        type: matchedTicker.startsWith('SU') ? 'bond' : 'stock', 
                        name: matchedTicker, 
                        qty: qty, 
                        avg: 0, 
                        cur: 0 
                    });
                }
                found++;
                log.push(`${matchedTicker}: ${qty} шт.`);
            }
        }
    }

    if (found > 0) { 
        save(); 
        setTimeout(() => alert(`Распознано: ${found} активов.\n${log.join('\n')}\n\nПроверьте цены покупки вручную.`), 500); 
        updateMarkets(); 
    } else {
        alert('Активы не найдены. Попробуйте сделать скриншот четче или используйте список "Мои активы" в приложении брокера.');
    }
}

// === MARKET DATA ===
async function safeFetch(url, timeoutMs = 5000) {
    try { 
        const ctrl = new AbortController(); 
        const id = setTimeout(() => ctrl.abort(), timeoutMs); 
        const res = await fetch(url, { signal: ctrl.signal }); 
        clearTimeout(id); 
        return res.ok ? await res.json() : null; 
    } catch { return null; }
}

async function updateMarkets() {
    const btn = document.querySelector('.btn-moex');
    const oldText = btn.innerHTML;
    btn.disabled = true; 
    btn.innerHTML = '<div class="spinner" style="width:16px;height:16px;border-width:2px"></div>';

    // Gold
    if (holdings.some(h => h.type === 'gold')) {
        const cbr = await safeFetch('https://www.cbr-xml-daily.ru/daily_json.js');
        if (cbr?.Valute?.XAU?.Value) {
            const gPrice = cbr.Valute.XAU.Value / 31.1035; // per gram
            holdings.forEach(h => { if (h.type === 'gold') h.cur = Math.round(gPrice * 7.78); }); // 7.78g coin
        }
    }

    // Stocks/Bonds
    const moexHoldings = holdings.filter(h => h.type === 'stock' || h.type === 'bond');
    const uniqueTickers = [...new Set(moexHoldings.map(h => h.name.toUpperCase()))];

    // Process in batches to avoid rate limiting
    for (const t of uniqueTickers) {
        // Get Metadata (Board, FaceValue)
        const desc = await safeFetch(`https://iss.moex.com/iss/securities/${encodeURIComponent(t)}.json`);
        if (!desc) continue;

        let face = 1000; // Default for bonds usually
        // Try to find FACEVALUE in description
        if (desc.description?.data) {
            const fRow = desc.description.data.find(r => r[0] === 'FACEVALUE');
            if (fRow && fRow[2]) face = parseFloat(fRow[2]);
        }

        // Determine Board (TQBR for stocks, TQCB/TQOB for bonds)
        let board = 'TQBR';
        if (desc.boards?.data) {
            const bc = desc.boards.columns;
            const bi = bc.indexOf('boardid');
            const bd = desc.boards.data;
            // Prefer specific boards
            const preferred = moexHoldings.find(h => h.name.toUpperCase() === t)?.type === 'bond' 
                ? ['TQCB', 'TQOB', 'TQIR'] 
                : ['TQBR', 'TQTF'];
            
            const foundBoard = bd.find(r => preferred.includes(r[bi]));
            if (foundBoard) board = foundBoard[bi];
        }

        // Get Price
        const md = await safeFetch(`https://iss.moex.com/iss/engines/stock/markets/shares/boards/${board}/securities/${encodeURIComponent(t)}.json`);
        if (md?.marketdata?.data?.length) {
            const cols = md.marketdata.columns;
            const row = md.marketdata.data[0];
            const lastIdx = cols.indexOf('LAST');
            const wapIdx = cols.indexOf('WAPRICE');
            
            let price = null;
            if (lastIdx > -1 && row[lastIdx]) price = row[lastIdx];
            else if (wapIdx > -1 && row[wapIdx]) price = row[wapIdx];

            if (price) {
                holdings.forEach(h => {
                    if (h.name.toUpperCase() === t) {
                        h.cur = h.type === 'bond' ? (price * face / 100) : price;
                    }
                });
            }
        }
    }

    save();
    btn.disabled = false;
    btn.innerHTML = oldText;
}

// === EXPORT/IMPORT ===
function exportData() {
    const dataStr = "data:text/json;charset=utf-8," + encodeURIComponent(JSON.stringify(holdings, null, 2));
    const a = document.createElement('a'); a.href = dataStr; a.download = `portfolio_${new Date().toISOString().slice(0,10)}.json`; a.click();
}

function importData(input) {
    const file = input.files[0]; if (!file) return;
    const reader = new FileReader();
    reader.onload = (e) => {
        try { 
            const data = JSON.parse(e.target.result); 
            if (Array.isArray(data)) { 
                if(confirm(`Загрузить ${data.length} записей? Текущие данные будут заменены.`)) {
                    holdings = data; 
                    save(); 
                    alert('Данные восстановлены!');
                }
            } 
        } catch { alert('Ошибка файла'); }
    };
    reader.readAsText(file);
}
